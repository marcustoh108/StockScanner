<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e141b"/>
      <stop offset="1" stop-color="#1a2836"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- ascending bars -->
  <g>
    <rect x="150" y="660" width="150" height="220" rx="20" fill="#2ea043"/>
    <rect x="360" y="540" width="150" height="340" rx="20" fill="#33ac4c"/>
    <rect x="570" y="400" width="150" height="480" rx="20" fill="#39c057"/>
    <rect x="780" y="230" width="150" height="650" rx="20" fill="#40d763"/>
  </g>

  <!-- magnifying glass -->
  <circle cx="560" cy="390" r="190" fill="#111820" stroke="#4da3ff" stroke-width="62"/>
  <line x1="695" y1="525" x2="850" y2="680" stroke="#4da3ff" stroke-width="70" stroke-linecap="round"/>
</svg>
</body>
</html>
